<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Aula CSS - 1</title>
</head>
<style>
	.card{
		width:500px; 
		height: fit-content; 
		background-color: aliceblue; 
		border: solid 2px navy; 
		margin: 20px; 
		padding: 40px;
	}
	.border{
		border-radius: 20px; 
	}
	.icone1{
		width: 100px; 
		height: 100px;
		background-image: url('https://cdn-icons-png.flaticon.com/512/706/706830.png'); 
		background-size: cover;
		border-radius: 25px;
	}
	.text{
		font-family: Arial, Helvetica, sans-serif; 
		font-size: 30px;
	}
	.title{
		color: navy;
		font-style:italic;
	}
	.main-color{
		color: navy; 
		font-style:italic;
	}

	p{
		font-size: 15px;
	}
	.italic{
		font-style: italic;
	}
	.icone2{
		width: 100px; 
		height: 100px;
		background-image: url('https://cdn-icons-png.flaticon.com/256/3681/3681928.png'); 
		background-size: cover;
		border-radius: 25px;
	}
</style>
<body>

	<div class="card border">

		<div class="icone1">
		</div>

		<div>
			<h1 class="text">
				Meu nome é: <span class="title">Adriana</span>
			</h1>

			<p class="font">
				Mensagem: <span class="main-color">A vida não é um morango! É tá tudo bem!</span>
			</p>
		</div>
	</div>

	<div class="card border ">

		<div class="icone2">
		</div>

		<div>
			<h1 class="text">
				Meu nome é:<span class="main-color"> Hugo</span>
			</h1>

			<p class="font ">
				Mensagem: <span class="main-color">Um dia é da caça, o outro é do caçador.</span>
			</p>
		</div>
	</div>


</body>

</html>
